<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> Inventory Management System</h1>
    
    <div class="form-section">
      <h2>Add/Update Item</h2>
      <form id="inventoryForm">
        <div class="form-group">
          <label for="productName">Product Name:</label>
          <input type="text" id="productName" placeholder="Enter product name" required>
        </div>
        
        <div class="form-group">
          <label for="quantity">Quantity:</label>
          <input type="number" id="quantity" placeholder="Enter quantity" min="1" required>
        </div>
        
        <div class="form-group">
          <label for="price">Price ($):</label>
          <input type="number" id="price" placeholder="Enter price" min="0" step="0.01" required>
        </div>
        
        <div class="form-actions">
          <button type="submit" id="addBtn" class="btn btn-add">Add Item</button>
          <button type="reset" class="btn btn-reset">Clear Form</button>
        </div>
      </form>
    </div>

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search products..." class="search-box">
    </div>

    <div class="inventory-section">
      <h2>Current Inventory</h2>
      <div id="emptyState" class="empty-state">
        <p>No items in inventory. Add your first item above!</p>
      </div>
      
      <table id="inventoryTable" class="inventory-table" style="display: none;">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total Value</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <div class="stats-section">
      <h3>Inventory Statistics</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Total Items</span>
          <span class="stat-value" id="totalItems">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Total Quantity</span>
          <span class="stat-value" id="totalQuantity">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Total Value</span>
          <span class="stat-value" id="totalValue">$0.00</span>
        </div>
      </div>
    </div>

    <div class="actions-section">
      <button id="exportBtn" class="btn btn-secondary">Export Data</button>
      <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
